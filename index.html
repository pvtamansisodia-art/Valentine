<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Swati, be my Valentine? 💘</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="bg-hearts" aria-hidden="true"></div>

  <main class="card" role="main">
    <div class="badge">💌 secret mission</div>

    <h1>
      Swati,<br/>
      will you be my <span class="shine">Valentine</span>? 💖
    </h1>

    <p class="sub">
      I promise snacks, smiles, and a very respectable amount of chaos ✨
    </p>

    <div class="actions" aria-label="valentine actions">
      <button id="yesBtn" class="btn yes" type="button">
        YES! 💞
      </button>

      <button id="noBtn" class="btn no" type="button">
        no 🙃
      </button>
    </div>

    <div id="message" class="message" aria-live="polite"></div>

    <footer class="footer">
      made with 💗 + mischief
    </footer>
  </main>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
